[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ournotes-qq-bot"
version = "0.1.0"
description = "BanG Dream! Our Notes QQ query bot prototype"
authors = [{name = "Adeliae"}]
requires-python = ">=3.10"
dependencies = ["qq-botpy==1.2.1", "Pillow>=11,<13", "aiohttp>=3.9,<4"]

[project.scripts]
ournotes-bot = "ournotes_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]
